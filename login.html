<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Empresa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Adicionando a imagem de fundo diretamente no estilo */
        body {
            background-image: url('../../img/bg1.jpg'); /* Caminho da sua imagem de fundo */
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-200">

    <!-- Container do Login -->
    <div class="bg-white bg-opacity-90 shadow-lg rounded-2xl p-8 w-full max-w-md sm:max-w-lg md:max-w-md lg:max-w-sm">

        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <img src="../../img/logo.png" alt="Logo" class="w-32 h-32 object-contain">
        </div>

        <!-- Título -->
        <h2 class="text-2xl font-bold text-center mb-4 text-gray-700">Acesse sua conta</h2>

        <!-- Formulário de Login -->
        <form method="POST" action="">
            {% csrf_token %}

            <!-- Campo Usuário -->
            <div class="mb-4">
                <label for="username" class="block text-gray-700">Usuário</label>
                <input type="text" id="username" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Digite seu usuário" required>
            </div>

            <!-- Campo Senha -->
            <div class="mb-6">
                <label for="password" class="block text-gray-700">Senha</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Digite sua senha" required>
            </div>

            <!-- Botão de Login -->
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg transition duration-200">
                Entrar
            </button>
        </form>

        <!-- Texto de rodapé -->
        <p class="mt-6 text-center text-sm text-gray-600">© 2025 PILLOWMED </p>
    </div>

</body>
</html>
